<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendMart - Admin Panel</title>
  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem("tm_theme");
        if (savedTheme === "dark" || savedTheme === "light") {
          document.documentElement.setAttribute("data-theme", savedTheme);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/customers-orders.css" />
  <link rel="stylesheet" href="css/orders.css" />
  <link rel="stylesheet" href="css/products.css" />
  <link rel="stylesheet" href="css/categories.css" />
  <link rel="stylesheet" href="css/banners-profile.css" />
  <link rel="stylesheet" href="css/settings.css" />
</head>
<body>
  <div id="root"></div>

  <!-- React & ReactDOM (CDN) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel for JSX support in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- App Scripts -->
  <script src="js/api.js"></script>
  <script src="js/storage.js"></script>
  <script type="text/babel" src="js/components/Sidebar.js"></script>
  <script type="text/babel" src="js/pages/Dashboard.js"></script>
  <script type="text/babel" src="js/pages/Customers.js"></script>
  <script type="text/babel" src="js/pages/Orders.js"></script>
  <script type="text/babel" src="js/pages/Products.js"></script>
  <script type="text/babel" src="js/pages/Banners.js"></script>
  <script type="text/babel" src="js/pages/Profile.js"></script>
  <script type="text/babel" src="js/pages/Settings.js"></script>
  <script type="text/babel" src="js/pages/Categories.js"></script>
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
